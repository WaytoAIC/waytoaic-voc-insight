<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退货 VOC 分诊报告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECF0; --surface:#FFFFFF; --ink:#131C29; --muted:#64717F;
  --rule:#D2D8E0; --indigo:#1C2C4A;
  --sans:"IBM Plex Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.7;letter-spacing:.01em}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 18px}}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
section{padding:64px 0;border-top:1px solid var(--rule)}
section:first-of-type{border-top:none}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:600;letter-spacing:-.01em;margin:10px 0 6px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 34px;font-size:15.5px}
h3{font-size:17px;font-weight:600;margin:0 0 8px}
.note{font-size:14px;color:var(--muted);margin-top:20px;max-width:68ch;line-height:1.75}

.mast{padding:56px 0 44px;background:var(--indigo);color:#EEF1F5;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 44px);
  pointer-events:none}
.mast .eyebrow{color:#8EA0BD}
.mast h1{font-size:clamp(30px,5.6vw,52px);font-weight:600;line-height:1.18;letter-spacing:-.02em;
  margin:14px 0 0;max-width:19ch}
.mast h1 em{font-style:normal;color:#F0C46A}
.subject{margin-top:18px;font-size:14.5px;color:#A9B8CE;font-family:var(--mono)}
.funnel{display:flex;flex-wrap:wrap;margin-top:40px;border-top:1px solid rgba(255,255,255,.18)}
.fstep{flex:1 1 180px;padding:20px 22px 20px 0;border-right:1px solid rgba(255,255,255,.14)}
.fstep:last-child{border-right:none}
.fstep .num{font-family:var(--mono);font-size:clamp(24px,4.2vw,36px);font-weight:500;line-height:1}
.fstep.keep .num{color:#F0C46A}
.fstep .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#8EA0BD;margin-top:10px}
.fstep .sub{font-size:13px;color:#B7C4D6;margin-top:6px;line-height:1.5}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-bottom:34px}
.kpi .k{background:var(--surface);padding:18px 20px 20px}
.kpi .k .n{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1}
.kpi .k .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-top:9px}
.kpi .k .s{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}

.sankey-shell{background:var(--surface);border:1px solid var(--rule);padding:22px 18px 14px}
.sankey-scroll{overflow-x:auto;overflow-y:hidden}
svg.sankey{width:100%;height:auto;display:block;overflow:visible}
@media(max-width:780px){
  .sankey-shell{padding:18px 12px 12px}
  svg.sankey{min-width:660px}
  .sankey-scroll::after{content:"左右滑动查看完整图";display:block;font-family:var(--mono);
    font-size:11px;color:var(--muted);padding-top:8px}
}
.ribbon{opacity:.5;transition:opacity .18s}
.sankey.dim .ribbon{opacity:.13}
.sankey.dim .ribbon.on{opacity:.82}
.nodelab{font-family:var(--mono);font-size:11px;fill:var(--ink)}
.nodeval{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.nodehit{cursor:pointer}
.sankey-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.sankey-legend b{font-weight:500;color:var(--ink)}
.swatch{display:inline-block;width:9px;height:9px;margin-right:6px}
.readout{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.7em}
.readout b{color:var(--ink);font-weight:500}

.triage{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.tc{background:var(--surface);padding:22px 20px 24px;border-top:3px solid var(--c)}
.tc .code{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--c);font-weight:600}
.tc .big{font-family:var(--mono);font-size:38px;font-weight:500;line-height:1;margin:12px 0 2px}
.tc .pct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tc .who{margin-top:16px;font-size:13px;font-weight:600}
.tc .act{margin-top:4px;font-size:13.5px;color:var(--muted);line-height:1.6}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:760px){.grid2{grid-template-columns:1fr;gap:24px}}
.panel{background:var(--surface);border:1px solid var(--rule);padding:24px}
.bar-row{display:grid;grid-template-columns:150px 1fr 34px;align-items:center;gap:12px;
  padding:5px 0;font-size:13.5px}
.bar-track{height:12px;background:#E4E8ED}
.bar-fill{height:100%;background:var(--indigo)}
.bar-row .v{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
@media(max-width:520px){.bar-row{grid-template-columns:110px 1fr 30px;font-size:12.5px}}

.rtable-scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table.reasons{width:100%;min-width:660px;border-collapse:collapse;font-size:14px}
table.reasons th{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);text-align:right;padding:12px;border-bottom:1px solid var(--rule);
  font-weight:500;white-space:nowrap}
table.reasons th:nth-child(-n+2){text-align:left}
table.reasons td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:right;
  font-family:var(--mono);font-size:12.5px;white-space:nowrap}
table.reasons td:nth-child(1){text-align:left;font-family:var(--sans);font-size:14px}
table.reasons td:nth-child(2){text-align:left;font-size:11.5px;color:var(--muted)}
table.reasons tr.dropped td{color:#98A2AE}
table.reasons tr.sub td{background:#F2F4F7;font-weight:600}
.flag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  padding:1px 6px;border:1px solid var(--rule);color:var(--muted)}
.flag.keep{border-color:var(--indigo);color:var(--indigo)}
.miniwrap{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.mini{width:64px;height:7px;background:#E4E8ED;flex:0 0 auto}
.mini i{display:block;height:100%;background:var(--indigo)}
tr.dropped .mini i{background:#B9C1CB}

.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.q{background:var(--surface);padding:20px}
.q p{margin:0;font-size:14.5px;line-height:1.65}
.q .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:12px}
.q .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  padding:2px 7px;color:#fff;margin-bottom:12px}

.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.ly{background:var(--surface);padding:22px 20px}
.ly .lv{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.ly h3{margin:12px 0 8px}
.ly p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}

table.todo{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--rule);font-size:14px}
table.todo th{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule);font-weight:500}
table.todo td{padding:13px 14px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.6}
table.todo tr:last-child td{border-bottom:none}
table.todo td.own{font-family:var(--mono);font-size:12px;white-space:nowrap}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  padding:2px 7px;color:#fff}
@media(max-width:640px){
  table.todo,table.todo tbody,table.todo tr,table.todo td{display:block;width:100%}
  table.todo thead{display:none}
  table.todo tr{border-bottom:1px solid var(--rule);padding:6px 0}
  table.todo td{border:none;padding:4px 14px}
}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font-family:var(--mono);font-size:12px;padding:6px 13px;background:transparent;
  border:1px solid var(--rule);color:var(--muted);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--indigo);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.chip:focus-visible,.nodehit:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
#vcount{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:12px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.vcard{background:var(--surface);padding:16px 18px}
.vcard .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.vcard .idx{font-family:var(--mono);font-size:11px;color:var(--muted)}
.vcard .txt{font-size:14px;line-height:1.6}
.vcard .tags{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}

footer{background:var(--indigo);color:#A9B8CE;padding:44px 0 52px;font-size:13.5px;line-height:1.75}
footer h3{color:#EEF1F5;font-size:15px;margin-bottom:10px}
footer .grid2{gap:36px}
footer ul{margin:0;padding-left:18px}
footer li{margin-bottom:7px}
footer .sig-line{margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#7F91AC}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* —— 通用版新增：逐项看两头 / 严重档构成 / 行动档位 —— */
.triage{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.dual{display:grid;grid-template-columns:150px 1fr 150px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.dual .bar{display:flex;height:16px;background:#E4E8ED;font-family:var(--mono);font-size:10.5px;color:#fff;overflow:hidden}
.dual .bar i{display:flex;align-items:center;justify-content:center;font-style:normal;white-space:nowrap}
.dual .bar .a{background:#1C2C4A}.dual .bar .b{background:#8792A3}
.dual .verdict{font-family:var(--mono);font-size:11px;text-align:right}
@media(max-width:620px){.dual{grid-template-columns:96px 1fr;}.dual .verdict{grid-column:1/-1;text-align:left;margin-top:-4px}}
.sevrow{display:grid;grid-template-columns:150px 1fr 130px;gap:12px;align-items:center;padding:5px 0;font-size:13.5px}
.sevrow .track{height:12px;background:#E4E8ED;position:relative}
.sevrow .track .all{position:absolute;left:0;top:0;height:100%;background:#B9C1CB}
.sevrow .track .hot{position:absolute;left:0;top:0;height:100%;background:#A93B32}
.sevrow .v{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.tier{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:.06em}
.kpi5{font-size:12.5px;line-height:1.65;white-space:normal!important;font-family:var(--sans)!important}
.kpi5 b{font-weight:600}.kpi5 .ifnot{display:block;margin-top:4px;color:#A93B32}
.sample-flag{display:inline-block;margin-left:10px;padding:1px 8px;border:1px solid #F0C46A;color:#F0C46A;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="eyebrow" id="m-eyebrow"></div>
    <h1 id="m-headline"></h1>
    <div class="subject" id="m-subject"></div>
    <div class="funnel" id="funnel"></div>
  </div>
</header>
<div class="wrap" id="main"></div>
<footer><div class="wrap">
  <div class="grid2">
    <div><h3>口径</h3><ul id="f-scope"></ul></div>
    <div><h3>这批数据答不了什么</h3><ul id="f-caveats"></ul></div>
  </div>
  <div class="sig-line" id="f-sig"></div>
</div></footer>

<script>
const P = __PAYLOAD__;
const S = P.stats, INS = P.insights || {}, PREP = S.prep || {}, CFG = P.cfg || {}, TX = CFG.texts || {};
const ATTRS = CFG.attrs || [], N = S.n;
const AC = Object.fromEntries(ATTRS.map(a=>[a.name,a.color]));
const CN = PREP['原因码中文'] || {};
const KEEPSET = new Set(PREP['留下的码'] || []);
const pc = (x,d=1)=>(x*100).toFixed(d)+'%';
const esc = s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const el = h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const main = document.getElementById('main');
const sec = (eyebrow,h2,lede,inner)=>main.appendChild(el(
  `<section><div class="eyebrow">${esc(eyebrow)}</div><h2>${h2}</h2>`+
  (lede?`<p class="lede">${lede}</p>`:'')+inner+`</section>`));
const rname = c => CN[c] || c;

/* ---------- 报头 + 漏斗 ---------- */
document.title = `${P.product}｜${TX['报告名']||'退货 VOC 分诊报告'}`;
document.getElementById('m-eyebrow').innerHTML = esc(INS.eyebrow || TX['报告名'] || '退货 VOC 分诊报告') +
  (P.is_sample?'<span class="sample-flag">示例数据</span>':'');
document.getElementById('m-headline').innerHTML = INS.headline || '退货分诊';
document.getElementById('m-subject').textContent = INS.subtitle || P.product;
{
  const k = PREP['口径']||{}, t = PREP['留剔']||{}, sc = PREP['本次范围']||{};
  const steps = [
    [PREP['退货行数'], '全部退货', '只算退货，换货不在内'],
    [sc['行数'], '本次范围', `${sc['产品']||''}`],
    [t['留'], '剔掉与产品无关的', `物流 / 客户改主意 / 没给原因，共 ${t['剔掉的码有几类']??'—'} 类`],
    [N, '客户写了原因的', `占本次范围 ${k['退货明细行']?pc(N/k['退货明细行']):'—'}`]
  ].filter(s=>s[0]!=null);
  document.getElementById('funnel').innerHTML = steps.map((s,i)=>
    `<div class="fstep ${i===steps.length-1?'keep':''}"><div class="num">${s[0]}</div>
     <div class="lab">${esc(s[1])}</div><div class="sub">${esc(s[2])}</div></div>`).join('');
}

/* ---------- 口径数字条 + 原因码汇总 ---------- */
{
  const k = PREP['口径']||{}, v = PREP['原话']||{}, t = PREP['留剔']||{}, sc = PREP['本次范围']||{};
  const kpi = [
    [k['退货明细行'], '退货明细行', '本次范围内的退货行数'],
    [k['退货订单'], '退货订单', '同一订单只算一次'],
    [v['覆盖率']!=null?pc(v['覆盖率']):'—', '写了原因的占比', '写了字的 ÷ 明细行'],
    [t['留']!=null?pc(t['留']/(sc['行数']||1)):'—', '留下的占比', `剔掉 ${t['剔']||0} 条与产品无关的`]
  ].filter(x=>x[0]!=null);
  const rd = PREP['原因码分布']||{};
  const rows = Object.entries(rd).sort((a,b)=>b[1]-a[1]);
  if(rows.length){
    const tot = rows.reduce((s,r)=>s+r[1],0), max = rows[0][1];
    const line = ([c,n])=>`<tr class="${KEEPSET.has(c)?'':'dropped'}">
      <td>${esc(rname(c))}</td><td>${esc(c)}</td><td>${n}</td>
      <td><div class="miniwrap">${pc(n/tot)}<div class="mini"><i style="width:${n/max*100}%"></i></div></div></td>
      <td><span class="flag ${KEEPSET.has(c)?'keep':''}">${KEEPSET.has(c)?'留':'剔'}</span></td></tr>`;
    const kept = rows.filter(r=>KEEPSET.has(r[0])), drop = rows.filter(r=>!KEEPSET.has(r[0]));
    const sub = (lb,arr)=>{const s=arr.reduce((x,r)=>x+r[1],0);
      return `<tr class="sub"><td colspan="2">${lb}</td><td>${s}</td><td>${pc(s/tot)}</td><td></td></tr>`;};
    const W = PREP['提醒']||{};
    sec(INS.scope_eyebrow||'口径与原因汇总', INS.scope_title||'退货原因的构成，和这次怎么清洗的',
      INS.scope_lede||'', `
      <div class="kpi">${kpi.map(x=>`<div class="k"><div class="n">${x[0]}</div>
        <div class="l">${esc(x[1])}</div><div class="s">${esc(x[2])}</div></div>`).join('')}</div>
      <div class="rtable-scroll"><table class="reasons"><thead><tr>
        <th>退货原因</th><th>原因码</th><th>条数</th><th>占比</th><th>处理</th></tr></thead>
        <tbody>${kept.map(line).join('')}${sub('留 · 跟产品有关',kept)}
        ${drop.map(line).join('')}${sub('剔 · 跟产品无关',drop)}</tbody></table></div>
      ${Object.values(W).filter(x=>typeof x==='string').map(x=>`<p class="note">⚠ ${esc(x)}</p>`).join('')}`);
  }
}

/* ---------- 两头是否对称：整体一层 + 逐项一层 ---------- */
{
  const band=c=>({'正常':'#35706A','两头都有':'#35706A','轻度偏移':'#B9821B','明显偏移':'#A93B32',
                  '严重异常':'#8B241C','一边倒':'#8B241C','样本少':'#AAB4C0'}[c]||'#6C7B8E');
  const gauge=(lb,o)=>{
    if(!o||!o['合计'])return '';
    const c=band(o['判定']);
    return `<div class="panel" style="margin-bottom:1px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px;flex-wrap:wrap">
        <h3 style="margin:0">${esc(lb)}</h3>
        <span style="font-family:var(--mono);font-size:12px;color:${c}">差距 ${o['差距']} 个点 · ${esc(o['判定'])}</span></div>
      <div style="display:flex;height:34px;font-family:var(--mono);font-size:12px;color:#fff">
        <div style="width:${o['一头占比']}%;background:#1C2C4A;display:flex;align-items:center;justify-content:center">${esc(o['一头'])} ${o['一头条数']}</div>
        <div style="width:${o['另一头占比']}%;background:#8792A3;display:flex;align-items:center;justify-content:center">${esc(o['另一头'])} ${o['另一头条数']}</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px">
        <span>${o['一头占比']}%</span><span>合计 ${o['合计']} 条</span><span>${o['另一头占比']}%</span></div></div>`;
  };
  const rl = (PREP['两头对称_原因码层']||[]), vl = (S.sym_overall||[]);
  let blocks='';
  vl.forEach(v=>{
    const r = rl.find(x=>x['属性']===v['属性']);
    const left = r&&r['合计'] ? gauge(`${v['属性']} · 原因码那一层（全部退货）`, r)
      : `<div class="panel" style="margin-bottom:1px"><h3>${esc(v['属性'])} · 原因码那一层</h3>
         <p style="font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.65">
         ${esc((r&&r['原因'])||'平台原因码里没有方向信息。')}</p></div>`;
    blocks += `<div class="grid2">${left}${gauge(`${v['属性']} · 原话那一层（读出来的）`, v)}</div>`;
  });
  const items=(S.sym_items||[]).filter(x=>x['合计']>0);
  let itemsHtml='';
  if(items.length){
    itemsHtml = `<div class="panel" style="margin-top:28px"><h3>同一把尺子，到下一层再量一遍</h3>
      <p style="font-size:13.5px;color:var(--muted);margin:8px 0 16px;line-height:1.65">
      整体对称，只说明整体没做偏，不等于没问题。下面每一项单独量：两头都有人说＝个人差异；几乎全在一头＝这一项做偏了。</p>`+
      items.map(o=>`<div class="dual"><div>${esc(o['细项'])}</div>
        <div class="bar">${o['一头条数']?`<i class="a" style="width:${o['一头占比']}%">${esc(o['一头'])} ${o['一头条数']}</i>`:''}
        ${o['另一头条数']?`<i class="b" style="width:${o['另一头占比']}%">${esc(o['另一头'])} ${o['另一头条数']}</i>`:''}</div>
        <div class="verdict" style="color:${band(o['判定'])}">${esc(o['判定'])} · 共 ${o['合计']} 条</div></div>`).join('')+`</div>`;
  }
  const rvv=S.rvv||{};
  let rv='';
  if(Object.keys(rvv).length){
    rv=`<div class="panel" style="margin-top:28px"><h3>原因码说的方向，和原话说的方向，对得上吗</h3>
      <p style="font-size:13.5px;color:var(--muted);margin:8px 0 16px;line-height:1.65">
      对得上的多，说明原因码在这一款上可信；对不上，就只能看总量。这个数同时也是打标质量的自检。</p>`+
      Object.entries(rvv).map(([c,v])=>`<div class="bar-row"><div>${esc(rname(c))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${v['一致率']*100}%"></div></div>
        <div class="v">${pc(v['一致率'],0)}</div></div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin:-2px 0 10px">
        ${v['条数']} 条里 一致 ${v['方向一致']} · 相反 ${v['方向相反']} · 没说方向 ${v['未表方向']}</div>`).join('')+`</div>`;
  }
  if(blocks||itemsHtml){
    const bands=(CFG.bands||[]).map((b,i,arr)=>(b[0]>=999?`${arr[i-1]?arr[i-1][0]:''} 以上`:`${i?arr[i-1][0]+'–':'≤'}${b[0]}`)+` ${b[1]}`).join(' ｜ ');
    const first=vl[0]||{};
    sec(INS.sym_eyebrow||TX['对称章节眉题']||'两头是否对称',
      INS.sym_title||(first['合计']?`${first['属性']}：两头差 ${first['差距']} 个点 —— ${first['判定']}`:'两头是否对称'),
      INS.sym_lede||TX['对称章节导语']||'', blocks+itemsHtml+rv+
      `<p class="note">整体那一层的判定线：${esc(bands)}。这几条线是这个品类自己标的，换品类要重新标。
       逐项那一层：两头合计不到 ${CFG.item_min_n||8} 条只当线索。</p>`);
  }
}

/* ---------- 连线图：平台记的原因 × 读出来该谁改 ---------- */
if((S.links||[]).length){
  sec(INS.sankey_eyebrow||'平台记的，和客户说的', INS.sankey_title||'平台记录的退货原因，和客户实际说的不是一回事',
    INS.sankey_lede||'左边是平台的退货原因码，右边是逐条读完原话之后判定的"该谁改"。线越粗，条数越多。',
    `<div class="sankey-shell"><div class="sankey-scroll">
       <svg class="sankey" id="sankey" role="img" aria-label="平台退货原因与读出来的该谁改之间的流向图"></svg>
     </div><div class="sankey-legend" id="legend"></div>
     <div class="readout" id="readout"></div></div>`);
  const W=900,PADT=14,GAP=9,NW=11,LW=180,RW=150,x1=LW,x2=W-RW-NW;
  const lT={},rT={};
  S.links.forEach(l=>{lT[l.r]=(lT[l.r]||0)+l.v;rT[l.a]=(rT[l.a]||0)+l.v;});
  const lefts=Object.keys(lT).sort((a,b)=>lT[b]-lT[a]);
  const rights=ATTRS.map(a=>a.name).filter(a=>rT[a]);
  const unit=Math.max(2.2,Math.min(6,340/Math.max(...Object.values(lT),1)));
  const hL=lefts.reduce((s,k)=>s+lT[k]*unit,0)+GAP*(lefts.length-1);
  const hR=rights.reduce((s,k)=>s+rT[k]*unit,0)+GAP*(rights.length-1);
  const H=Math.max(hL,hR)+PADT*2;
  const lP={},rP={};
  let y=PADT+(H-2*PADT-hL)/2; lefts.forEach(k=>{lP[k]={y0:y,h:lT[k]*unit,off:0};y+=lT[k]*unit+GAP;});
  y=PADT+(H-2*PADT-hR)/2; rights.forEach(k=>{rP[k]={y0:y,h:rT[k]*unit,off:0};y+=rT[k]*unit+GAP;});
  const svg=document.getElementById('sankey'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const NS='http://www.w3.org/2000/svg';
  const e=(t,a)=>{const x=document.createElementNS(NS,t);for(const k in a)x.setAttribute(k,a[k]);return x;};
  const gR=e('g',{}); svg.appendChild(gR);
  lefts.forEach(r=>rights.forEach(a=>{
    const f=S.links.find(l=>l.r===r&&l.a===a); if(!f)return;
    const h=f.v*unit, ya=lP[r].y0+lP[r].off, yb=rP[a].y0+rP[a].off;
    lP[r].off+=h; rP[a].off+=h;
    const xa=x1+NW,xb=x2,mx=(xa+xb)/2;
    const p=e('path',{d:`M${xa},${ya} C${mx},${ya} ${mx},${yb} ${xb},${yb} L${xb},${yb+h} C${mx},${yb+h} ${mx},${ya+h} ${xa},${ya+h} Z`,
      fill:'#'+AC[a],class:'ribbon'});
    p.dataset.r=r;p.dataset.a=a;p.dataset.v=f.v;gR.appendChild(p);
  }));
  const DEF='点一下或把鼠标移到任意一头（也可以用 Tab 键），看它流向哪里。';
  const ro=document.getElementById('readout'); ro.textContent=DEF;
  function focus(key,side,tot){
    svg.classList.add('dim'); const parts=[];
    gR.querySelectorAll('.ribbon').forEach(p=>{
      const hit=side==='L'?p.dataset.r===key:p.dataset.a===key;
      p.classList.toggle('on',hit);
      if(hit)parts.push((side==='L'?p.dataset.a:rname(p.dataset.r))+' '+p.dataset.v+'条');
    });
    ro.innerHTML=`<b>${esc(side==='L'?rname(key):key)}</b>（${tot} 条）→ `+parts.map(esc).join(' · ');
  }
  function clr(){svg.classList.remove('dim');gR.querySelectorAll('.ribbon').forEach(p=>p.classList.remove('on'));ro.textContent=DEF;}
  function node(key,side,pos,tot){
    const x=side==='L'?x1:x2;
    svg.appendChild(e('rect',{x,y:pos.y0,width:NW,height:pos.h,fill:side==='L'?'#1C2C4A':'#'+AC[key]}));
    const g=e('g',{class:'nodehit',tabindex:'0',role:'button'});
    g.appendChild(e('rect',{x:side==='L'?0:x+NW,y:pos.y0-3,width:side==='L'?x1:RW,height:pos.h+6,fill:'transparent'}));
    const tx=side==='L'?x1-10:x2+NW+10;
    const t=e('text',{x:tx,y:pos.y0+pos.h/2+1,class:'nodelab','text-anchor':side==='L'?'end':'start','dominant-baseline':'middle'});
    t.textContent=side==='L'?rname(key):key;
    g.appendChild(t);
    if(pos.h>26){const v=e('text',{x:tx,y:pos.y0+pos.h/2+14,class:'nodeval','text-anchor':side==='L'?'end':'start','dominant-baseline':'middle'});
      v.textContent=tot+' 条';g.appendChild(v);}
    ['mouseenter','click','focus'].forEach(ev=>g.addEventListener(ev,()=>focus(key,side,tot)));
    ['mouseleave','blur'].forEach(ev=>g.addEventListener(ev,clr));
    svg.appendChild(g);
  }
  lefts.forEach(k=>node(k,'L',lP[k],lT[k])); rights.forEach(k=>node(k,'R',rP[k],rT[k]));
  document.getElementById('legend').innerHTML=rights.map(a=>
    `<span><i class="swatch" style="background:#${AC[a]}"></i><b>${esc(a)}</b> ${rT[a]}</span>`).join('');
}

/* ---------- 该谁改 + 严重档的构成 ---------- */
{
  const OWN=INS.owners||{};
  const cards=ATTRS.filter(a=>S.attr[a.name]).map(a=>{
    const n=S.attr[a.name], o=OWN[a.name]||[a.dept,a.dir];
    return `<div class="tc" style="--c:#${a.color}"><div class="code">${esc(a.name)}</div>
      <div class="big">${n}</div><div class="pct">占 ${N} 条 ${pc(n/N)}</div>
      <div class="who">${esc(o[0])}</div><div class="act">${esc(o[1])}</div></div>`;}).join('');
  const sv=(S.sev_by_l1||[]).filter(x=>x.n>0), maxn=Math.max(1,...sv.map(x=>x.n));
  const sevPanel = sv.length&&S.sev_total ? `<div class="panel" style="margin-top:28px">
    <h3>量小不等于不要紧：「严重」那一档是谁贡献的</h3>
    <p style="font-size:13.5px;color:var(--muted);margin:8px 0 16px;line-height:1.65">
    灰条是这一类的条数，红条是其中判为「严重」的。条数少但红得多的，不影响退货量，影响星级。</p>`+
    sv.map(x=>`<div class="sevrow"><div>${esc(x.l1)}</div>
      <div class="track"><div class="all" style="width:${x.n/maxn*100}%"></div><div class="hot" style="width:${x.hot/maxn*100}%"></div></div>
      <div class="v">${x.n} 条 · 严重 ${x.hot}</div></div>`).join('')+
    `<p style="font-family:var(--mono);font-size:11px;color:var(--muted);margin:12px 0 0">「严重」共 ${S.sev_total} 条</p></div>` : '';
  sec(INS.triage_eyebrow||'分诊结果', INS.triage_title||`该谁改：${N} 条原话的责任分派`,
    INS.triage_lede||'', `<div class="triage">${cards}</div>`+
    (S.save?`<p class="note">其中 <b>${S.save}</b> 条（${pc(S.save/N)}）标为「能挽回」——${esc(TX['能挽回说明']||'退货后已经换了或明确说要换。这部分不是流失。')}</p>`:'')+sevPanel);
}

/* ---------- 客户在说什么 ---------- */
{
  const ent=Object.entries(S.tags_in||{}).sort((a,b)=>b[1]-a[1]);
  if(ent.length){
    const max=ent[0][1];
    const bars=ent.map(([t,v])=>`<div class="bar-row"><div>${esc(t)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div>
      <div class="v">${v}</div></div>`).join('');
    sec(INS.pain_eyebrow||'客户在说什么', INS.pain_title||'客户在说什么',
      INS.pain_lede||`进排名的门槛：至少提到 ${S.gate} 次（有原话的 ${N} 条 × 3%，不到 3 取 3）。门槛跟着数据量走，不写死。`,
      `<div class="panel">${bars}</div>`+(INS.pain_note?`<p class="note">${INS.pain_note}</p>`:''));
  }
}

/* ---------- 自由章节 ---------- */
(INS.sections||[]).forEach(s=>{
  let inner='';
  if(s.bars&&s.bars.length){
    const max=Math.max(...s.bars.map(b=>b[1]));
    inner+=`<div class="panel">`+s.bars.map(b=>`<div class="bar-row"><div>${esc(b[0])}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${b[1]/max*100}%"></div></div>
      <div class="v">${b[1]}</div></div>`).join('')+`</div>`;
  }
  if(s.quotes&&s.quotes.length){
    inner+=`<div class="quotes">`+s.quotes.map(q=>`<div class="q">
      ${q.tag?`<span class="tag" style="background:#${AC[q.attr]||'1C2C4A'}">${esc(q.tag)}</span>`:''}
      <p>“${esc(q.text)}”</p><div class="meta">${esc(q.cite||'')}</div></div>`).join('')+`</div>`;
  }
  if(s.body) inner+=`<p class="note">${s.body}</p>`;
  sec(s.eyebrow||'', s.title||'', s.lede||'', inner);
});

/* ---------- 三层洞察 ---------- */
if((INS.layers||[]).length){
  sec(INS.layers_eyebrow||'三层洞察', INS.layers_title||'从发生了什么，到不改会怎样', '',
    `<div class="layers">`+INS.layers.map(l=>`<div class="ly"><div class="lv">${esc(l.level)} · ${esc(l.q||'')}</div>
      <h3>${esc(l.title)}</h3><p>${l.body}</p></div>`).join('')+`</div>`);
}

/* ---------- 行动清单 ---------- */
if((INS.todo||[]).length){
  const kpi5=t=>{
    if(t.metric){
      return `<b>看哪个数</b> ${esc(t.metric)}<br><b>现在</b> ${esc(t.now??'—')} → <b>要到</b> ${esc(t.target??'—')}<br>
        <b>哪天看</b> ${esc(t.when??'—')}`+(t.if_not?`<span class="ifnot"><b>要是没变</b> ${esc(t.if_not)}</span>`:'');
    }
    return esc(t.kpi||'');
  };
  sec(INS.todo_eyebrow||'行动清单', INS.todo_title||'下一步做什么', INS.todo_lede||'',
    `<table class="todo"><thead><tr><th style="width:96px">该谁改</th><th>动作</th>
     <th style="width:120px">谁负责</th><th style="width:250px">怎么才算做完</th>
     <th style="width:60px">依据</th></tr></thead><tbody>`+
    INS.todo.map(t=>`<tr><td><span class="pill" style="background:#${AC[t.attr]||'1C2C4A'}">${esc(t.attr||'')}</span>
      ${t.tier?`<span class="tier">${esc(t.tier)}</span>`:''}</td>
      <td>${t.body}</td><td class="own">${esc(t.owner||'')}</td>
      <td class="own kpi5">${kpi5(t)}</td><td class="own">${t.n!=null?t.n+' 条':''}</td></tr>`).join('')+
    `</tbody></table>`);
}

/* ---------- 原话查阅 ---------- */
{
  sec(INS.voice_eyebrow||'原话查阅', INS.voice_title||`${N} 条原话，按「该谁改」筛选`,
    INS.voice_lede||'每个结论都能点回具体的某一条。发现必须有客户的原话撑着，否则不成立。',
    `<div class="filters" id="filters"></div><div id="vcount"></div><div class="vlist" id="vlist"></div>`);
  const fb=document.getElementById('filters'),list=document.getElementById('vlist'),cn=document.getElementById('vcount');
  let active='全部';
  ['全部'].concat(ATTRS.map(a=>a.name).filter(a=>S.attr[a])).forEach(a=>{
    const b=document.createElement('button');
    b.className='chip';b.type='button';b.textContent=a==='全部'?`全部 ${N}`:`${a} ${S.attr[a]}`;
    b.setAttribute('aria-pressed',a===active);
    b.onclick=()=>{active=a;fb.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');render();};
    fb.appendChild(b);
  });
  function render(){
    const rows=active==='全部'?P.records:P.records.filter(r=>r['该谁改']===active);
    cn.textContent=`显示 ${rows.length} / ${N} 条`;
    list.innerHTML=rows.map(r=>`<div class="vcard"><div class="head">
      <span class="pill" style="background:#${AC[r['该谁改']]||'AAB4C0'}">${esc(r['该谁改']||'')}</span>
      <span class="idx">#${r['序号']} · ${esc(r['规格']||'')} · ${esc(rname(r['平台原因码']))}${r['多严重']==='严重'?' · 严重':''}${r['能否挽回']==='是'?' · 能挽回':''}</span></div>
      <div class="txt">${esc(r['原话'])}</div>
      <div class="tags">${esc([r['哪件事_细项'],r['什么情况下'],r['谁在说'],r['过程感受']].filter(Boolean).join(' · '))}</div></div>`).join('');
  }
  render();
}

/* ---------- 页脚 ---------- */
{
  const k=PREP['口径']||{},v=PREP['原话']||{},sc=PREP['本次范围']||{};
  const scope=[
    `范围：${P.product}${sc['站点']&&sc['站点']!=='全部'?' · '+sc['站点']:''}${PREP['时间跨度']?' · '+PREP['时间跨度'].join(' ~ '):''}`,
    `口径：退货明细行 ${k['退货明细行']??'—'} / 退货订单 ${k['退货订单']??'—'}`,
    `后面所有比例的分母都是这 ${N} 条有原话的记录，不是全部退货`,
    `一条原话可以说到好几件事，所以各项加起来大于 ${N}；「该谁改」每条只选一个，加起来等于 ${N}`,
    `网页里不带订单号和记录编号`
  ];
  document.getElementById('f-scope').innerHTML=scope.map(s=>`<li>${esc(s)}</li>`).join('');
  const cav=(INS.caveats||[]).slice();
  if(v['覆盖率']!=null)cav.unshift(`写了原因的只占 ${pc(v['覆盖率'])}。结论只适用于「愿意说话的那部分退货客户」，而且这部分人偏负面`);
  document.getElementById('f-caveats').innerHTML=cav.map(s=>`<li>${esc(s)}</li>`).join('');
  document.getElementById('f-sig').textContent=INS.sig||TX['落款']||'';
}
</script>
</body>
</html>
